<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanity Test: Audio Path Check</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 { margin-top: 0; color: #f472b6; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .status-box {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
      word-break: break-all;
    }
    .status-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
    .status-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 Audio Sanity Check</h2>
    <p>Testing path:<br><code>images/lover.mp3.mp3</code></p>
    
    <button class="btn" id="testBtn">▶️ Tap to Test Audio</button>

    <div class="status-box" id="statusBox"></div>
  </div>

  <script>
    const testBtn = document.getElementById('testBtn');
    const statusBox = document.getElementById('statusBox');

    // Target candidate path
    const testPath = 'images/lover.mp3.mp3';
    const audio = new Audio(testPath);

    testBtn.addEventListener('click', () => {
      statusBox.style.display = 'block';
      statusBox.className = 'status-box';
      statusBox.innerHTML = '⏳ Loading & Attempting to Play...';

      audio.play()
        .then(() => {
          statusBox.className = 'status-box status-success';
          statusBox.innerHTML = '✅ SUCCESS!<br>Audio is playing successfully from:<br><code>' + testPath + '</code>';
          testBtn.textContent = '⏸ Pause Audio';
          testBtn.onclick = () => {
            if (audio.paused) {
              audio.play();
              testBtn.textContent = '⏸ Pause Audio';
            } else {
              audio.pause();
              testBtn.textContent = '▶️ Resume Audio';
            }
          };
        })
        .catch((err) => {
          statusBox.className = 'status-box status-error';
          statusBox.innerHTML = '❌ PLAYBACK FAILED<br>Error: ' + err.message + '<br><br><small>Double check if file exists at images/lover.mp3.mp3 on GitHub Pages.</small>';
        });
    });
  </script>

</body>
</html>
